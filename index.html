/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=1;

function resize(){

  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);

  updateGround();

  if(levelData){
    rebuildLevel();
  }
}

function updateGround(){
  groundY=H-Math.max(105,Math.min(145,H*.18));
}

addEventListener("resize",resize);


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function audio(){

  if(!audioCtx){
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    }catch(e){}
  }

  if(audioCtx?.state==="suspended"){
    audioCtx.resume();
  }
}

function beep(freq=440,duration=.08,type="square",volume=.035){

  if(!audioCtx)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(volume,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

function jumpSound(){
  beep(420,.06,"square",.03);
  setTimeout(()=>beep(620,.07,"square",.025),35);
}

function coinSound(){
  beep(880,.06,"square",.035);
  setTimeout(()=>beep(1320,.08,"square",.03),55);
}

function stompSound(){
  beep(130,.09,"square",.04);
}

function hurtSound(){
  beep(120,.18,"sawtooth",.04);
}

function powerSound(){
  beep(500,.08,"square",.04);
  setTimeout(()=>beep(700,.08,"square",.04),70);
  setTimeout(()=>beep(1000,.12,"square",.04),140);
}

function fireSound(){
  beep(700,.05,"square",.03);
  setTimeout(()=>beep(500,.05,"square",.03),50);
}


/* =========================================================
   INPUT - MOBILE OPTIMIZED
========================================================= */

const keys={
  left:false,
  right:false,
  jump:false
};

function bindControl(id,key){

  const el=document.getElementById(id);

  function down(e){
    e.preventDefault();
    e.stopPropagation();
    audio();
    keys[key]=true;
    el.classList.add("active");
  }

  function up(e){
    e.preventDefault();
    e.stopPropagation();
    keys[key]=false;
    el.classList.remove("active");
  }

  el.addEventListener("touchstart",down,{passive:false});
  el.addEventListener("touchend",up,{passive:false});
  el.addEventListener("touchcancel",up,{passive:false});

  el.addEventListener("mousedown",down);
  el.addEventListener("mouseup",up);
  el.addEventListener("mouseleave",up);
}

bindControl("left","left");
bindControl("right","right");
bindControl("jump","jump");

const fireBtn=document.getElementById("fireBtn");

function shootFireball(){
  if(!firePower || fireCooldown>0 || !gameRunning)return;

  fireballs.push({
    x:player.x+(player.facing>0?player.w:0),
    y:player.y+18,
    w:14,
    h:14,
    vx:player.facing>0?9:-9,
    vy:-1
  });

  fireCooldown=15;
  fireSound();
}

fireBtn.addEventListener("touchstart",e=>{
  e.preventDefault();
  e.stopPropagation();
  audio();
  shootFireball();
},{passive:false});

fireBtn.addEventListener("mousedown",e=>{
  e.preventDefault();
  shootFireball();
});

// Tastatur-Steuerung für Desktop
addEventListener("keydown",e=>{

  audio();

  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")
    keys.left=true;

  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")
    keys.right=true;

  if(e.key==="ArrowUp"||e.key==="w"||e.key==="W"||e.key===" ")
    keys.jump=true;

  if(e.key==="x"||e.key==="X"||e.key==="f"||e.key==="F")
    shootFireball();

  if(e.key==="Escape")
    togglePause();
});

addEventListener("keyup",e=>{

  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")
    keys.left=false;

  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")
    keys.right=false;

  if(e.key==="ArrowUp"||e.key==="w"||e.key==="W"||e.key===" ")
    keys.jump=false;
});

/* =========================================================
   LEVEL BUILD
========================================================= */

function rebuildLevel(){

  if(!levelData)return;

  platforms=levelData.platforms.map(p=>{

    const o={...p};

    if(o.y==="ground"){
      o.y=groundY;
    }else{
      o.y=groundY-o.dy;
    }

    return o;
  });

  coinList=levelData.coins.map(c=>({
    x:c[0],
    y:groundY-c[1],
    r:10,
    taken:false,
    spin:Math.random()*Math.PI*2
  }));

  enemies=JSON.parse(JSON.stringify(levelData.enemies)).map(e=>({
    x:e[0],
    y:groundY-34,
    w:34,
    h:34,
    vx:e[2],
    startX:e[0],
    minX:e[0]-130,
    maxX:e[0]+130,
    dead:false,
    anim:Math.random()*10
  }));

  // Koopas
  koopas=[
    {x:1100,y:groundY-38,w:32,h:38,vx:-1.2,state:"walking"},
    {x:2350,y:groundY-38,w:32,h:38,vx:1.3,state:"walking"}
  ];

  // Feuerblumen
  fireFlowers=[
    {x:1100,y:groundY-145,w:28,h:28,taken:false}
  ];

  shells=[];
  fireballs=[];
  firePower=false;

  if(fireBtn){
    fireBtn.style.display="none";
  }

  powerups=(levelData.powerups||[]).map(p=>({
    x:p.x,
    y:groundY-p.y,
    w:25,
    h:25,
    type:p.type,
    collected:false,
    vy:0,
    bob:Math.random()*6
  }));

  movingPlatforms=[];

  checkpoint={
    x:100,
    y:groundY-100
  };
}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(num){

  currentLevel=num;

  if(num>6){
    gameWon();
    return;
  }

  levelData=levelDefinitions[num];

  rebuildLevel();

  player.x=100;
  player.y=groundY-100;

  player.spawnX=100;
  player.spawnY=groundY-100;

  player.vx=0;
  player.vy=0;
  player.ground=false;

  player.invincible=0;
  player.power=false;
  player.powerTimer=0;

  camera=0;

  transition=false;
  gameRunning=true;

  document.getElementById("level").textContent=
    `Level ${num}/6 - ${levelData.name}`;

  document.getElementById("messageOverlay").classList.add("hidden");

  updateUI();
}


/* =========================================================
   COLLISION
========================================================= */

function collide(a,b){

  return(
    a.x < b.x+b.w &&
    a.x+a.w > b.x &&
    a.y < b.y+b.h &&
    a.y+a.h > b.y
  );
}


/* =========================================================
   PARTICLES
========================================================= */

function particle(x,y,color,amount=8){

  for(let i=0;i<amount;i++){

    particles.push({
      x,
      y,
      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.7)*5,
      life:30+Math.random()*25,
      max:55,
      size:2+Math.random()*4,
      color
    });
  }
}

function updateParticles(){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=.16;
    p.vx*=.98;

    p.life--;

    if(p.life<=0)
      particles.splice(i,1);
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=Math.max(0,p.life/p.max);

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x-camera,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   PLAYER PHYSICS
========================================================= */

function respawn(){

  hurtSound();

  player.x=checkpoint.x;
  player.y=checkpoint.y;

  player.vx=0;
  player.vy=0;

  player.invincible=120;

  shake=10;

  flash=.8;

  particle(
    player.x+player.w/2,
    player.y+player.h/2,
    "#fff",
    18
  );
}

function hurt(){

  if(player.invincible>0)
    return;

  lives--;

  if(lives<=0){

    lives=3;
    coins=0;
    stars=0;

    startLevel(currentLevel);

    return;
  }

  respawn();
}

function updatePlayer(){

  /* horizontal */

  const acceleration=player.ground ? .75 : .48;

  if(keys.left){

    player.vx-=acceleration;
    player.facing=-1;

  }

  if(keys.right){

    player.vx+=acceleration;
    player.facing=1;
  }

  if(!keys.left&&!keys.right){

    player.vx*=player.ground?.78:.96;
  }

  const maxSpeed=player.power?7.2:5.8;

  player.vx=Math.max(
    -maxSpeed,
    Math.min(maxSpeed,player.vx)
  );


  /* jump buffer */

  if(keys.jump)
    player.jumpBuffer=8;

  else if(player.jumpBuffer>0)
    player.jumpBuffer--;


  /* coyote time */

  if(player.ground)
    player.coyote=8;

  else if(player.coyote>0)
    player.coyote--;


  if(
    player.jumpBuffer>0 &&
    player.coyote>0
  ){

    player.vy=-14;

    player.ground=false;

    player.jumpBuffer=0;
    player.coyote=0;

    jumpSound();

    particle(
      player.x+player.w/2,
      player.y+player.h,
      "#fff",
      7
    );
  }


  /* gravity */

  player.vy+=.62;

  if(player.vy>16)
    player.vy=16;


  /* variable jump */

  if(
    !keys.jump &&
    player.vy<0
  ){
    player.vy*=.88;
  }


  /* horizontal collision */

  player.x+=player.vx;

  for(const p of platforms){

    if(collide(player,p)){

      if(player.vx>0)
        player.x=p.x-player.w;

      if(player.vx<0)
        player.x=p.x+p.w;

      player.vx=0;
    }
  }


  /* vertical */

  player.y+=player.vy;

  player.ground=false;

  for(const p of platforms){

    if(collide(player,p)){

      if(player.vy>0){

        player.y=p.y-player.h;
        player.vy=0;
        player.ground=true;

      }else if(player.vy<0){

        player.y=p.y+p.h;
        player.vy=0;
      }
    }
  }


  /* animation */

  player.anim+=
    Math.abs(player.vx)*.18+.08;


  if(player.invincible>0)
    player.invincible--;


  /* power */

  if(player.powerTimer>0){

    player.powerTimer--;

    if(player.powerTimer<=0){
      player.power=false;
      document.getElementById("power").style.opacity=0;
    }
  }


  /* fall */

  if(player.y>H+300){
    hurt();
  }
}


/* =========================================================
   COINS
========================================================= */

function updateCoins(){

  for(const c of coinList){

    if(c.taken)continue;

    c.spin+=.08;

    if(
      collide(player,{
        x:c.x-c.r,
        y:c.y-c.r,
        w:c.r*2,
        h:c.r*2
      })
    ){

      c.taken=true;
      coins++;

      coinSound();

      particle(
        c.x,
        c.y,
        "#ffd21f",
        10
      );
    }
  }
}


/* =========================================================
   POWERUPS
========================================================= */

function updatePowerups(){

  for(const p of powerups){

    if(p.collected)continue;

    p.bob+=.05;

    const box={
      x:p.x-13,
      y:p.y-13+Math.sin(p.bob)*4,
      w:26,
      h:26
    };

    if(collide(player,box)){

      p.collected=true;

      powerSound();

      player.power=true;
      player.powerTimer=600;

      document.getElementById("power").textContent=
        p.type==="star"
        ? "⭐ STAR POWER!"
        : "🍄 POWER-UP!";

      document.getElementById("power").style.opacity=1;

      particle(
        p.x,
        p.y,
        p.type==="star"?"#fff":"#e52521",
        20
      );
    }
  }
}


/* =========================================================
   ENEMIES
========================================================= */

function updateEnemies(){

  for(const e of enemies){

    if(e.dead)continue;

    e.anim+=.12;

    e.x+=e.vx;

    if(e.x<e.minX||e.x>e.maxX){
      e.vx*=-1;
    }

    if(!collide(player,e))
      continue;

    if(
      player.vy>2 &&
      player.y+player.h<e.y+18
    ){

      e.dead=true;

      player.vy=-9;

      stars++;

      stompSound();

      particle(
        e.x+e.w/2,
        e.y+e.h/2,
        "#d88945",
        14
      );

    }else{

      if(player.power){

        player.power=false;
        player.powerTimer=0;

        document.getElementById("power").style.opacity=0;

        e.dead=true;

        particle(
          e.x+e.w/2,
          e.y+e.h/2,
          "#fff",
          20
        );

      }else{

        hurt();
      }
    }
  }
}


/* =========================================================
   CHECKPOINT
========================================================= */

function updateCheckpoint(){

  const checkpointX=
    Math.max(0,levelData.goalX*.48);

  if(
    player.x>checkpointX &&
    checkpoint.x<checkpointX
  ){

    checkpoint={
      x:player.x,
      y:groundY-100
    };

    particle(
      checkpoint.x,
      checkpoint.y,
      "#4cff78",
      20
    );
  }
}


/* =========================================================
   LEVEL COMPLETE
========================================================= */

function completeLevel(){

  if(transition)return;

  transition=true;
  gameRunning=false;

  const collected=
    coinList.filter(c=>c.taken).length;

  const total=coinList.length;

  document.getElementById("messageTitle").textContent=
    `LEVEL ${currentLevel} CLEAR! 🎉`;

  document.getElementById("messageText").innerHTML=
    `🪙 ${collected}/${total} Münzen<br>`+
    `❤️ ${lives} Leben<br>`+
    `⭐ ${stars} Gegner besiegt`;

  document.getElementById("messageButton").textContent=
    currentLevel===6?"GEWINNEN!":"WEITER";

  document.getElementById("messageOverlay").classList.remove("hidden");

  beep(523,.1);
  setTimeout(()=>beep(659,.1),100);
  setTimeout(()=>beep(784,.15),200);

  }else{
    startLevel(currentLevel+1);

};

/* =========================================================

========================================================= */

function togglePause(){

  if(transition)return;

  paused=!paused;

  if(paused){

    gameRunning=false;

    document
      .getElementById("pauseOverlay")
      .classList.remove("hidden");

  }else{

    gameRunning=true;

    document
      .getElementById("pauseOverlay")
      .classList.add("hidden");
  }
}

  togglePause();
};

};


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawCloud(x,y,scale=1){

  const px=x-camera*.18;

  ctx.fillStyle="rgba(255,255,255,.92)";

  ctx.fillRect(px,y,90*scale,25*scale);

  ctx.fillRect(
    px+20*scale,
    y-18*scale,
    50*scale,
    30*scale
  );

  ctx.fillRect(
    px+55*scale,
    y+5*scale,
    50*scale,
    20*scale
  );
}

function drawBackground(){

  const sky=ctx.createLinearGradient(0,0,0,H);

  sky.addColorStop(0,"#43baff");
  sky.addColorStop(1,"#c5f1ff");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);


  /* sun */

  ctx.fillStyle="#fff36b";

  ctx.beginPath();
  ctx.arc(
    W*.82,
    H*.18,
    35,
    0,
    Math.PI*2
  );
  ctx.fill();


  /* clouds */

  drawCloud(100,100,1);
  drawCloud(550,155,.8);
  drawCloud(1050,90,1.1);
  drawCloud(1700,130,.9);
  drawCloud(2400,90,1.1);
  drawCloud(3200,150,.9);
  drawCloud(4000,105,1);
  drawCloud(4700,170,.8);


  /* distant hills */

  ctx.fillStyle="#70cf57";

  for(
    let x=-600;
    x<6000;
    x+=550
  ){

    const px=x-camera*.25;

    ctx.beginPath();

    ctx.moveTo(px,H);

    ctx.lineTo(px+275,H*.42);

    ctx.lineTo(px+550,H);

    ctx.fill();
  }


  /* foreground hills */

  ctx.fillStyle="#4fbd49";

  for(
    let x=-400;
    x<6000;
    x+=700
  ){

    const px=x-camera*.38;

    ctx.beginPath();

    ctx.moveTo(px,H);

    ctx.lineTo(px+350,H*.58);

    ctx.lineTo(px+700,H);

    ctx.fill();
  }
}


/* =========================================================
   DRAW PLATFORMS
========================================================= */

function drawPlatforms(){

  for(const p of platforms){

    const x=p.x-camera;

    if(x+p.w<0||x>W)continue;

    /* dirt */

    ctx.fillStyle="#92501d";

    ctx.fillRect(
      x,
      p.y,
      p.w,
      p.h
    );

    /* grass */

    ctx.fillStyle="#2ec943";

    ctx.fillRect(
      x,
      p.y,
      p.w,
      12
    );

    /* grass highlights */

    ctx.fillStyle="#64df58";

    for(
      let gx=x;
      gx<x+p.w;
      gx+=24
    ){

      ctx.fillRect(
        gx,
        p.y,
        11,
        4
      );
    }

    /* dirt pattern */

    ctx.fillStyle="#6e3615";

    for(
      let dx=x+10;
      dx<x+p.w;
      dx+=34
    ){

      ctx.fillRect(
        dx,
        p.y+23,
        5,
        8
      );
    }
  }
}


/* =========================================================
   DRAW COINS
========================================================= */

function drawCoins(){

  for(const c of coinList){

    if(c.taken)continue;

    const x=c.x-camera;

    if(x<-30||x>W+30)continue;

    const squash=
      Math.abs(Math.sin(c.spin))*.65+.35;

    ctx.save();

    ctx.translate(x,c.y);

    ctx.scale(squash,1);

    ctx.fillStyle="#ffd21f";

    ctx.beginPath();
    ctx.ellipse(
      0,0,
      10,
      14,
      0,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="#fff39b";

    ctx.fillRect(-3,-8,3,16);

    ctx.restore();
  }
}


/* =========================================================
   DRAW POWERUPS
========================================================= */

function drawPowerups(){

  for(const p of powerups){

    if(p.collected)continue;

    const x=p.x-camera;
    const y=p.y+Math.sin(p.bob)*4;

    ctx.save();

    ctx.translate(x,y);

    if(p.type==="star"){

      ctx.fillStyle="#ffe33a";

      ctx.beginPath();

      for(let i=0;i<10;i++){

        const a=-Math.PI/2+i*Math.PI/5;
        const r=i%2===0?15:7;

        const px=Math.cos(a)*r;
        const py=Math.sin(a)*r;

        if(i===0)
          ctx.moveTo(px,py);
        else
          ctx.lineTo(px,py);
      }

      ctx.closePath();
      ctx.fill();

      ctx.fillStyle="#fff";
      ctx.fillRect(-5,-4,3,4);
      ctx.fillRect(3,-4,3,4);

    }else{

      ctx.fillStyle="#e52521";
      ctx.fillRect(-13,-10,26,22);

      ctx.fillStyle="#fff";
      ctx.fillRect(-8,-6,7,8);
      ctx.fillRect(2,-6,7,8);

      ctx.fillStyle="#8b4513";
      ctx.fillRect(-10,8,20,5);
    }

    ctx.restore();
  }
}


/* =========================================================
   DRAW FEUERBLUMEN
========================================================= */

function drawFireFlowers(){

  for(const f of fireFlowers){

    if(f.taken)continue;

    const x=f.x-camera;
    const y=f.y;

    // Stiel
    ctx.fillStyle="#35a83b";
    ctx.fillRect(x+11,y+12,7,16);

    // Blume
    ctx.fillStyle="#ff3b30";
    ctx.beginPath();
    ctx.arc(x+14,y+9,10,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(x+14,y+9,4,0,Math.PI*2);
    ctx.fill();
  }
}


/* =========================================================
   DRAW KOOPAS
========================================================= */

function drawKoopas(){

  for(const k of koopas){

    const x=k.x-camera;
    const y=k.y;

    if(k.state==="walking"){

      // Körper
      ctx.fillStyle="#f39c12";
      ctx.fillRect(x+5,y+10,22,22);

      // Panzer
      ctx.fillStyle="#159447";
      ctx.beginPath();
      ctx.arc(x+16,y+17,15,Math.PI,Math.PI*2);
      ctx.fill();

      // Kopf
      ctx.fillStyle="#f5b041";
      ctx.fillRect(x+3,y+3,25,15);

      // Augen
      ctx.fillStyle="white";
      ctx.fillRect(x+8,y+6,5,6);
      ctx.fillRect(x+19,y+6,5,6);

      ctx.fillStyle="black";
      ctx.fillRect(x+10,y+8,2,3);
      ctx.fillRect(x+21,y+8,2,3);

    }else{

      // Eingezogener Panzer
      ctx.fillStyle="#159447";
      ctx.beginPath();
      ctx.arc(x+16,y+20,17,0,Math.PI*2);
      ctx.fill();

      ctx.strokeStyle="#0b5f2b";
      ctx.lineWidth=3;
      ctx.stroke();
    }
  }
}


/* =========================================================
   DRAW PANZER
========================================================= */

function drawShells(){

  for(const s of shells){

    const x=s.x-camera;
    const y=s.y;

    ctx.fillStyle="#159447";

    ctx.beginPath();
    ctx.arc(
      x+s.w/2,
      y+s.h/2,
      s.w/2,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#0b5f2b";
    ctx.lineWidth=3;
    ctx.stroke();

    // Panzer-Muster
    ctx.strokeStyle="#78d64b";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(x+7,y+7);
    ctx.lineTo(x+20,y+20);
    ctx.moveTo(x+20,y+7);
    ctx.lineTo(x+7,y+20);
    ctx.stroke();
  }
}

   DRAW FEUERBÄLLE

function drawFireballs(){

    ctx.beginPath();

    );

      x+b.w/2,

    );

}


/* =========================================================
   DRAW ENEMIES

function drawEnemies(){

    );

    ctx.fillRect(8,13,7,7);
    ctx.fillRect(19,13,7,7);

    ctx.fillStyle="#000";

    ctx.fillRect(11,15,3,4);
    ctx.fillRect(21,15,3,4);

/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

  if(
    player.invincible>0 &&
    Math.floor(player.invincible/5)%2===0
  ){
    return;
  }

  const x=Math.round(player.x-camera);
  const y=Math.round(player.y);

  ctx.save();

  ctx.translate(
    x+player.w/2,
    y+player.h/2
  );

  ctx.scale(
    player.facing,
    1
  );

  const running=
    Math.abs(player.vx)>.5 &&
    player.ground;

  const leg=
    running
    ? Math.sin(player.anim*2)*4
    : 0;


  /* shadow */

  ctx.globalAlpha=.18;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    0,
    24,
    18,
    5,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;


  /* legs */

  ctx.fillStyle="#74341f";

  ctx.fillRect(
    -13+leg,
    14,
    10,
    10
  );

  ctx.fillRect(
    4-leg,
    14,
    10,
    10
  );


  /* body */

  ctx.fillStyle=
    player.power
    ? "#b63cff"
    : "#2450b7";

  ctx.fillRect(
    -14,
    -2,
    28,
    20
  );


  /* shirt */

  ctx.fillStyle="#e52521";

  ctx.fillRect(
    -14,
    -8,
    28,
    13
  );


  /* face */

  ctx.fillStyle="#f3ad76";

  ctx.fillRect(
    -9,
    -12,
    19,
    17
  );

  ctx.fillRect(
    5,
    -8,
    9,
    11
  );


  /* hair */

  ctx.fillStyle="#71331f";

  ctx.fillRect(
    -10,
    -15,
    19,
    6
  );


  /* cap */

  ctx.fillStyle=
    player.power
    ? "#8e31ff"
    : "#e52521";

  ctx.fillRect(
    -13,
    -21,
    25,
    8
  );

  ctx.fillRect(
    -7,
    -25,
    17,
    7
  );


  /* eye */

  ctx.fillStyle="#000";

  ctx.fillRect(
    6,
    -7,
    3,
    5
  );


  /* arm */

  ctx.fillStyle="#f3ad76";

  ctx.fillRect(
    10,
    1,
    9,
    7
  );


  /* glove */

  ctx.fillStyle="#fff";

  ctx.fillRect(
    16,
    2,
    6,
    7
  );

  ctx.restore();
}


/* =========================================================
   DRAW GOAL
========================================================= */

function drawGoal(){

  const x=levelData.goalX-camera;

  if(x<-80||x>W+80)return;

  /* pipe */

  ctx.fillStyle="#176d18";

  ctx.fillRect(
    x,
    groundY-135,
    55,
    135
  );

  ctx.fillStyle="#2fc32f";

  ctx.fillRect(
    x+5,
    groundY-130,
    45,
    130
  );

  ctx.fillStyle="#125112";

  ctx.fillRect(
    x-5,
    groundY-145,
    65,
    18
  );

  ctx.fillStyle="#36d636";

  ctx.fillRect(
    x,
    groundY-143,
    55,
    12
  );


  /* flag */

  ctx.fillStyle="#ddd";

  ctx.fillRect(
    x+26,
    groundY-220,
    5,
    75
  );

  ctx.fillStyle="#e52521";

  ctx.beginPath();

  ctx.moveTo(
    x+31,
    groundY-220
  );

  ctx.lineTo(
    x+80,
    groundY-202
  );

  ctx.lineTo(
    x+31,
    groundY-184
  );

  ctx.fill();
}


/* =========================================================
   DRAW CHECKPOINT
========================================================= */

function drawCheckpoint(){

  if(!checkpoint)return;

  const x=checkpoint.x-camera;

  if(
    x<-50||
    x>W+50||
    checkpoint.x<=100
  )return;

  ctx.fillStyle="#eee";

  ctx.fillRect(
    x,
    groundY-90,
    4,
    90
  );

  ctx.fillStyle="#4cff78";

  ctx.beginPath();

  ctx.moveTo(
    x+4,
    groundY-90
  );

  ctx.lineTo(
    x+38,
    groundY-78
  );

  ctx.lineTo(
    x+4,
    groundY-66
  );

  ctx.fill();
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawPlatforms();
  drawCheckpoint();
  drawCoins();
  drawPowerups();
  drawFireFlowers();
  drawKoopas();
  drawShells();
  drawFireballs();
  drawEnemies();
  drawGoal();
  drawPlayer();

  drawParticles();


  /* camera shake */

  if(shake>0){

    shake*=.88;

    if(shake<.1)
      shake=0;
  }


  /* flash */

  if(flash>0){

    ctx.fillStyle=
      `rgba(255,255,255,${flash})`;

    ctx.fillRect(0,0,W,H);

    flash*=.88;

    if(flash<.01)
      flash=0;
  }
}


/* =========================================================
   UPDATE
========================================================= */

function update(){

  if(!gameRunning||paused)
    return;

  updatePlayer();
  updateCoins();
  updatePowerups();
  updateEnemies();

  // ===============================
  // FEUERBLUME
  // ===============================

  for(const f of fireFlowers){
    if(f.taken)continue;

    if(collide(player,f)){
      f.taken=true;
      firePower=true;

      if(fireBtn){
        fireBtn.style.display="block";
      }
      fireCooldown=0;
    }
  }


  // ===============================
  // KOOPAS
  // ===============================

  for(const k of koopas){

    if(k.state==="walking"){
      k.x+=k.vx;

      // Umkehren, wenn er irgendwo ankommt
      for(const p of platforms){
        if(
          k.x+k.w>p.x &&
          k.x<p.x+p.w &&
          k.y+k.h>=p.y &&
          k.y+k.h<=p.y+15
        ){
          if(k.x<=p.x+5 || k.x+k.w>=p.x+p.w-5){
            k.vx*=-1;
          }
        }
      }
    }

    // Spieler trifft Koopa
    if(collide(player,k)){

      // Von oben draufgesprungen
      if(player.vy>1 && player.y+player.h<k.y+22){

        player.y=k.y-player.h;
        player.vy=-10;

        k.state="shell";
        k.vx=0;

      }else{

        // Normaler Treffer
        hurt();
      }
    }
  }

  for(let i=koopas.length-1;i>=0;i--){

    const k=koopas[i];

    if(k.state==="shell"){

      // Spieler berührt den stehenden Panzer
      if(collide(player,k)){

        if(Math.abs(player.vx)>1){

          shells.push({
            x:k.x,
            y:k.y+8,
            w:34,
            h:28,
            vx:player.x<k.x?9:-9
          });

          koopas.splice(i,1);
        }
      }
    }
  }


  // ===============================
  // PANZER
  // ===============================

  for(let i=shells.length-1;i>=0;i--){

    const s=shells[i];

    s.x+=s.vx;

    // Reibung
    if(s.vx!==0){
      s.vx*=0.995;

      if(Math.abs(s.vx)<0.15){
        s.vx=0;
      }
    }

    // Panzer + Spieler
    if(collide(player,s)){

      // Spieler läuft in stehenden Panzer
      if(Math.abs(s.vx)<0.2){

        if(player.x+s.w/2 < s.x+s.w/2){
          s.vx=9;
        }else{
          s.vx=-9;
        }

      }else{

        // bewegenden Panzer berühren = Schaden
        if(player.vy>1 && player.y+player.h<s.y+15){
          player.vy=-10;
          s.vx*=0.8;
        }else{
          hurt();
        }
      }
    }

    // Panzer trifft Gegner
    for(const e of enemies){

      if(e.x<-9000)continue;

      if(collide(s,e)){

        e.x=-9999;
        s.vx*=0.95;
      }
    }

    // Welt verlassen
    if(s.x<-500 || s.x>7000){
      shells.splice(i,1);
    }
  }


  // ===============================
  // FEUERBÄLLE
  // ===============================

  if(fireCooldown>0)fireCooldown--;

  for(let i=fireballs.length-1;i>=0;i--){

    const b=fireballs[i];

    b.x+=b.vx;
    b.y+=b.vy;

    // leicht nach unten
    b.vy+=0.12;

    // Boden -> Feuerball springt
    if(b.y+b.h>=groundY){
      b.y=groundY-b.h;
      b.vy=-5;
    }

    // Gegner treffen
    for(const e of enemies){

      if(e.x<-9000)continue;

      if(collide(b,e)){

        e.x=-9999;
        fireballs.splice(i,1);
        break;
      }
    }

    // Koopa treffen
    for(const k of koopas){

      if(k.state==="walking" && collide(b,k)){

        k.state="shell";
        k.vx=0;

        fireballs.splice(i,1);
        break;
      }
    }

    if(b.x<-500 || b.x>7000){
      fireballs.splice(i,1);
    }
  }

  updateCheckpoint();

  updateParticles();

  updateCamera();

  updateUI();

  if(
    player.x>levelData.goalX-28 &&
    player.x<levelData.goalX+70 &&
    player.ground
  ){

    completeLevel();
  }
}


/* =========================================================
   LOOP
========================================================= */

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}


/* =========================================================
   INIT
========================================================= */

updateGround();

startLevel(1);

loop();

</script>
